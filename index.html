<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scam Spotter: Inbox, Messages &amp; Phone</title>
<style>
:root{--bg:#eef1fb;--card:#fff;--ink:#1c2233;--mute:#5d667d;--line:#dde2ee;--acc:#4f46e5;--accink:#fff;--good:#15803d;--goodbg:#dcfce7;--miss:#b45309;--missbg:#fef3c7;--bad:#be123c;--badbg:#ffe4e6;--sel:#e0e7ff;--bub:#e9ecf5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#1a1e33;--ink:#eef0fa;--mute:#a3abc6;--line:#2c3252;--acc:#818cf8;--accink:#0f1220;--good:#4ade80;--goodbg:#14341f;--miss:#fbbf24;--missbg:#3a2c0a;--bad:#fb7185;--badbg:#3d1420;--sel:#2b3166;--bub:#262c4a}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#1a1e33;--ink:#eef0fa;--mute:#a3abc6;--line:#2c3252;--acc:#818cf8;--accink:#0f1220;--good:#4ade80;--goodbg:#14341f;--miss:#fbbf24;--missbg:#3a2c0a;--bad:#fb7185;--badbg:#3d1420;--sel:#2b3166;--bub:#262c4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:12px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;transition:transform .1s}
button:active{transform:scale(.96)}
button.primary{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
button.scam{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:700}
button.safe{background:var(--good);color:#fff;border-color:var(--good);font-weight:700}
@media (prefers-color-scheme:dark){button.safe{color:#0f1220}button.scam{color:#0f1220}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:1.35rem;margin:0}
.chips{display:flex;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-weight:700;font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#ec4899,#6366f1);transition:width .4s}
.nav{display:flex;gap:8px;margin-bottom:10px}
.nav button{flex:1;font-weight:700;position:relative}
.nav button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.nav b{background:var(--bad);color:#fff;border-radius:99px;font-size:.72rem;padding:1px 7px;margin-left:4px}
.box{display:grid;grid-template-columns:290px 1fr;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:480px}
.list{border-right:1px solid var(--line);overflow:auto;max-height:78vh}
.item{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.item:hover,.item.cur{background:var(--sel)}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:1.05rem}
.it{min-width:0;flex:1}
.it b,.it span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it span{color:var(--mute);font-size:.88rem}
.it.unread b{font-weight:800}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);flex:none}
.stat{flex:none;font-size:1.2rem}
.reader{padding:14px;overflow:auto;max-height:78vh}
.empty{display:grid;place-items:center;height:100%;color:var(--mute);text-align:center;padding:30px}
.back{display:none;margin-bottom:8px}
.msg{white-space:pre-wrap;overflow-wrap:anywhere}
.mh{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;color:var(--mute)}
.hint{font-size:.88rem;color:var(--mute);margin:0 0 8px}
.bub{max-width:88%;padding:8px 12px;border-radius:18px 18px 18px 4px;margin:6px 0;background:var(--bub)}
.bub.speaking{outline:3px solid var(--acc);transform:scale(1.02)}
.who{font-size:.75rem;color:var(--mute);margin:8px 0 0}
.phone{text-align:center;padding:10px 0}
.phone .big{font-size:3rem;margin:0}
.p{cursor:pointer;border-radius:4px;padding:0 1px;border-bottom:2px dotted transparent}
.p:hover{border-bottom-color:var(--acc)}
.p.sel{background:var(--sel);border-bottom:2px solid var(--acc)}
.p.ok{background:var(--goodbg);border-bottom:2px solid var(--good)}
.p.miss{background:var(--missbg);border-bottom:2px solid var(--miss)}
.p.bad{background:var(--badbg);border-bottom:2px solid var(--bad);text-decoration:line-through}
.done .p{cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.actions button{flex:1;min-width:140px}
.fb{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:6px;animation:pop .35s}
.fb h3{margin:0 0 6px}
.fb ul{padding-left:18px;margin:6px 0}.fb li{margin:4px 0}
.k-ok{color:var(--good);font-weight:700}.k-miss{color:var(--miss);font-weight:700}.k-bad{color:var(--bad)}
.pts{position:fixed;left:50%;top:40%;font-size:2.2rem;font-weight:900;color:var(--acc);pointer-events:none;animation:fly 1.1s forwards;z-index:9}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
@keyframes fly{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-90px);opacity:0}}
@media (prefers-reduced-motion:reduce){.fb,.pts{animation:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.rules div{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.92rem}
.hero{font-size:3.5rem;margin:0;text-align:center}
@media (max-width:700px){.box{grid-template-columns:1fr}.list{max-height:none;border-right:0}.box.reading .list{display:none}.box:not(.reading) .reader{display:none}.back{display:inline-block}}
</style>
</head>

</main>

];
var TABS=[["email","📧 Mail"],["sms","💬 Messages"],["call","📞 Phone"]];
var BTN={email:["🚨 Report phishing","✅ Looks safe"],sms:["🚫 Block & report","✅ Looks safe"],call:["📵 Hang up & report","✅ Seems legit"]};
var tab="email",cur=null,sel={},res={},score=0,uid=0,tok=0,speaking=false;
var app=document.getElementById("app");
function $(q){return document.querySelector(q)}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function find(id){return S.filter(function(s){return s.id==id})[0]}
function flat(s){return s.head.concat.apply(s.head,s.msgs.map(function(m){return m.parts}))}
function parts(ps){return ps.map(function(p){
 if(!p[0])return"";

 var id="k"+(uid++),r=res[cur],pk=r?r.sel[id]:sel[id],c="";
 if(r){c=p[1]?(pk?"ok":"miss"):(pk?"bad":"")}else if(pk)c="sel";
 p[2]=id;return '<span class="p '+c+'" data-id="'+id+'">'+esc(p[0])+'</span>'}).join("")}
function header(){
 var n=Object.keys(res).length;
 $("#prog").textContent=n+"/"+S.length;$("#score").textContent="⭐ "+score;$("#pbar").style.width=(n/S.length*100)+"%";

  return '<button class="'+(tab==t[0]?"on":"")+'" data-t="'+t[0]+'">'+t[1]+(un?'<b>'+un+'</b>':'')+'</button>'}).join("");
 Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(b){b.onclick=function(){stopSpeak();tab=b.dataset.t;cur=null;view()}});
}
function view(){
 header();
 if(Object.keys(res).length==S.length&&cur==="finish")return finish();
 var items=S.filter(function(s){return s.type==tab});

  var r=res[s.id];
  return '<div class="item'+(cur==s.id?" cur":"")+'" data-o="'+s.id+'"><div class="av" style="background:'+s.col+'">'+(s.type=="call"?"📞":esc(s.n.charAt(0)))+'</div><div class="it'+(r?"":" unread")+'"><b>'+esc(s.n)+'</b><span>'+esc(s.pv)+'</span></div>'+(r?'<span class="stat">'+(r.correct?"✅":"❌")+'</span>':'<span class="dot"></span>')+'</div>'}).join("")+'</div><div class="reader">'+reader()+'</div></div>';
 if(Object.keys(res).length==S.length)h+='<div class="actions"><button class="primary" id="fin">🏅 See my detective badge</button></div>';
 app.innerHTML=h;
 Array.prototype.forEach.call(app.querySelectorAll("[data-o]"),function(el){el.onclick=function(){stopSpeak();cur=el.dataset.o;sel={};view()}});
 Array.prototype.forEach.call(app.querySelectorAll(".p"),function(el){el.onclick=function(){if(res[cur])return;var d=el.dataset.id;sel[d]=!sel[d];el.classList.toggle("sel",!!sel[d])}});
 var b;

 if(b=$("#play"))b.onclick=toggleAudio;

}

 var h='<button class="back" id="back">← Back</button>';

 }else{
  h+='<div class="phone"><p class="big">📞</p><div class="msg">'+parts(s.head)+'</div><p><button class="primary" id="play">'+(speaking?"⏹ Stop audio":"🔊 Answer & listen")+'</button></p></div>';
  h+=s.msgs.map(function(m,k){return '<div class="who">'+m.who+' says:</div><div class="bub msg" id="line'+k+'">“'+parts(m.parts)+'”</div>'}).join("");
 }

function feedback(s,r){
 var h='<div class="fb"><h3>';
 if(s.legit)h+=r.correct?"🙌 Right, this one is legit!":"🤦 Oops, that one was actually safe!";
 else h+=r.correct?"🎉 Nice catch, it’s a scam!":"😬 Careful, that was a scam!";
 h+=' <small>+'+r.pts+' ⭐</small></h3>';
 if(s.legit){

  if(r.bad)h+='<p class="k-bad">Crossed-out words were fine on their own.</p>';
  if(!r.correct)h+='<p>Next time: when in doubt, don’t click, don’t reply, and tell an adult.</p>';

}
function verdict(saidScam){

}
function finish(){
 var ok=0,flags=0,found=0,max=0;

 var t=pct>=85?["🏆","Master Detective"]:pct>=60?["🔍","Sharp Sleuth"]:["🐣","Rookie Detective"];
 app.innerHTML='<div class="card"><p class="hero">'+t[0]+'</p><h2 style="text-align:center;margin:4px 0">'+t[1]+'</h2><p style="text-align:center">'+score+' ⭐ · '+ok+'/'+S.length+' verdicts right · '+found+'/'+flags+' red flags spotted</p></div>'+
 '<div class="card"><b>The 4-step habit: S.L.A.P.</b><div class="rules"><div><b>🛑 Stop</b><br>Don’t react. Scams want you to rush.</div><div><b>👀 Look</b><br>Check the sender, number and link.</div><div><b>📞 Ask</b><br>Check with the real person or company using details you already trust.</div><div><b>🧑‍🤝‍🧑 Tell</b><br>Show a parent, teacher or trusted adult.</div></div><p>Never share passwords, PINs or codes. Gift cards and secrecy are always red flags. But not every message is a scam, so check before you panic. If you already clicked or shared something, tell an adult right away. You won’t be in trouble.</p></div><div class="actions"><button class="primary" id="again">🔄 Play again</button></div>';
 $("#again").onclick=function(){res={};score=0;cur=null;sel={};tab="email";view()};
}
// Audio: browser text-to-speech plus a simple ring tone
function stopSpeak(){tok++;speaking=false;if(window.speechSynthesis)speechSynthesis.cancel();

 var b=$("#play");if(b)b.textContent="🔊 Answer & listen"}
function ring(done){
 try{var C=window.AudioContext||window.webkitAudioContext,c=new C(),t=c.currentTime;

  setTimeout(function(){c.close();done()},1700)}catch(e){done()}}
function toggleAudio(){
 if(speaking){stopSpeak();return}
 if(!window.speechSynthesis){alert("Audio isn’t supported in this browser. Read the captions instead!");return}
 var s=find(cur),my=++tok;speaking=true;$("#play").textContent="⏹ Stop audio";
 var lines=s.msgs.map(function(m){return m.parts.map(function(p){return p[0]}).join("").replace(/\s+/g," ").trim()});
 var vs=speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang)}),voice=vs[0];
 function say(k){
  if(my!=tok)return;
  if(k>=lines.length){speaking=false;var b=$("#play");if(b)b.textContent="🔊 Answer & listen";return}
  var u=new SpeechSynthesisUtterance(lines[k]);u.rate=0.95;u.pitch=0.75;if(voice)u.voice=voice;
  u.onstart=function(){var e=$("#line"+k);if(e)e.classList.add("speaking")};
  u.onend=function(){var e=$("#line"+k);if(e)e.classList.remove("speaking");setTimeout(function(){say(k+1)},400)};
  u.onerror=function(){speaking=false};
  speechSynthesis.speak(u)}
 ring(function(){say(0)});
}
view();
